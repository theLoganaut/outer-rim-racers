function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  const k = s >= 1 ? Math.floor(s) : s;
  cv.style.width = W * k + 'px';
  cv.style.height = H * k + 'px';
}
addEventListener('resize', fit); fit();

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
function angdiff(a, b) {
  let d = a - b;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return d;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const hash2 = (x, y) => {          // cheap per-pixel hash
  let h = (x * 374761393 + y * 668265263) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return (h ^ (h >>> 16)) >>> 0;
};
const hexInt = s => {              // '#rrggbb' -> ABGR int for Uint32Array pixel buffers
  const n = parseInt(s.slice(1), 16);
  return (0xff000000 | ((n & 255) << 16) | (n & 0xff00) | (n >> 16)) >>> 0;
};
const pick = (rng, arr) => arr[(rng() * arr.length) | 0];

   --------------------------------------------------------------------- */
const SAVE_KEY = 'outer-rim-racer-v1';
function defaultSave() {
  return {
    tp: 15,
    vehicles: { landspeeder: true, bike: false, skim: false, pod: false },
    up: { speed: 0, accel: 0, cool: 0, armor: 0 },
    stats: { takedowns: 0, wins: 0, ramjet: 0, tours: 0 },
    best: {}
  };
}
function loadSave() {
  const d = defaultSave();
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (s) {
      for (const k in d) if (s[k] !== undefined) d[k] = (typeof d[k] === 'object') ? Object.assign(d[k], s[k]) : s[k];
    }
  } catch (e) {}
  return d;
}
const SAVE = loadSave();
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) {} }

const keys = new Set(), pressedKeys = new Set();
const BLOCK = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab'];
addEventListener('keydown', e => {
  if (BLOCK.includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  keys.add(e.code); pressedKeys.add(e.code);
  audioInit();
  if (AC && AC.state === 'suspended') AC.resume();
  if (e.code === 'KeyM') muted = !muted;
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());

/* ---------------------------------------------------------------------
   AUDIO (tiny WebAudio engine + beeps)
   --------------------------------------------------------------------- */
let AC = null, eng = null, engGain = null, engFilt = null, muted = false;
function audioInit() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    eng = AC.createOscillator(); eng.type = 'sawtooth';
    engFilt = AC.createBiquadFilter(); engFilt.type = 'lowpass'; engFilt.frequency.value = 600;
    engGain = AC.createGain(); engGain.gain.value = 0;
    eng.connect(engFilt); engFilt.connect(engGain); engGain.connect(AC.destination); eng.start();
  } catch (e) { AC = null; }
}
function beep(freq, dur, type = 'square', vol = 0.07, slideTo = 0) {
  if (!AC || muted) return;
  try {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq;
    if (slideTo) o.frequency.linearRampToValueAtTime(slideTo, AC.currentTime + dur);
    g.gain.value = vol; g.gain.linearRampToValueAtTime(0, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + dur);
  } catch (e) {}
}
function boomSfx() { beep(120, 0.6, 'sawtooth', 0.13, 30); beep(70, 0.7, 'square', 0.08, 25); }

const FONT = {};
for (const k in FONT_SRC) FONT[k] = FONT_SRC[k].replace(/\//g, '');
function drawTxt(s, x, y, sc, col) {
  ctx.fillStyle = col;
  for (let i = 0; i < s.length; i++) {
    const g = FONT[s[i]];
    if (!g) continue;
    for (let j = 0; j < 15; j++)
      if (g[j] === '1') ctx.fillRect(x + (i * 4 + (j % 3)) * sc, y + ((j / 3) | 0) * sc, sc, sc);
  }
}
const txtW = (s, sc) => String(s).length * 4 * sc - sc;
function txt(s, x, y, sc, col, shadow = '#000') {
  s = String(s).toUpperCase();
  if (shadow) drawTxt(s, x + sc, y + sc, sc, shadow);
  drawTxt(s, x, y, sc, col);
}
function txtC(s, y, sc, col, shadow) { txt(s, ((W - txtW(s, sc)) / 2) | 0, y, sc, col, shadow); }

const pad2 = n => (n < 10 ? '0' : '') + n;
function fmt(t) {
  t = Math.max(0, t);
  return Math.floor(t / 60) + ':' + pad2(Math.floor(t % 60)) + '.' + pad2(Math.floor((t * 100) % 100));

  const key = cls + b + l + r;

  const base = { k: '#14141f', b, l, r, c: '#6ff0ff', w: '#ffffff', g: '#8e93a8' };

    makeSprite(cls, { ...base, y: '#ff7a1a', f: '#ffd23a' })

/* ---------------------------------------------------------------------
   PLAYER ABILITIES

/* ---------------------------------------------------------------------

/* ---------------------------------------------------------------------

   --------------------------------------------------------------------- */
function trackProgress() {

    if (dd < bd) { bd = dd; best = i; }
  }
  if (bd > (TRK.width * 1.1) ** 2) {           // off the road (shortcut): widen the search
    for (let d = -110; d <= 110; d++) {
      const i = (P.idx + d + N) % N, q = pts[i], dd = (q.x - P.x) ** 2 + (q.y - P.y) ** 2;
      if (dd < bd) { bd = dd; best = i; }

  }
  let d = best - P.idx;
  if (d > N / 2) d -= N; if (d < -N / 2) d += N;

/* ---------------------------------------------------------------------

}

    if (b.ramCD <= 0 && straight && b.heat < 45 && b.ramT <= 0) { b.ramT = 1.3 + Math.random() * 1.3 + (b.reckless ? 2.2 : 0); b.ramCD = 3 + Math.random() * 4; }

  else if (hz === HZ.LAVA) { b.heat += 25 * dt; target *= 0.9; if (b.shield <= 0 && b.inv <= 0) b.hp -= 8 * dt; }
  else if (hz === HZ.WATER) { target *= 0.8; b.heat = Math.max(0, b.heat - 15 * dt); }

    if (mi.t < 0.8 && mi.own === b.id) continue;
    if (Math.abs(mi.x - bp.x) < 10 && Math.abs(mi.y - bp.y) < 10) {
      addBoom(mi.x, mi.y, false); mines.splice(m, 1);
      if (b.shield <= 0) { b.ion = 2.5; b.hp -= 20; b.v *= 0.6; if (b.hp <= 0) { crashBot(b, 'mine'); return; } }
    }
  }
  if (b.mineCD <= 0 && b.ion <= 0) { b.mineCD = 9 + Math.random() * 6; const q = posAt(b.s - 14); const w = laneXY(q, b.lat); mines.push({ x: w.x, y: w.y, own: b.id, t: 0 }); }
  b.v += clamp(target - b.v, -400 * dt, 360 * b.acc * dt);
  b.s += b.v * dt;
  b.lat += clamp(b.latT - b.lat, -65 * dt, 65 * dt) + b.latV * dt;
  b.latV *= Math.exp(-3 * dt);
  if (Math.random() < dt * 0.3 && Math.abs(b.latV) < 5) b.latT = clamp((Math.random() * 2 - 1) * (half - 22), -half + 14, half - 14);
  const lim = half - 8;
  if (Math.abs(b.lat) > lim) {                  // barrier: shoved racers take damage
    if (Math.abs(b.latV) > 40 && b.inv <= 0 && b.shield <= 0) { b.hp -= Math.abs(b.latV) * 0.2 / b.armor; b.inv = 0.4; b.hitT = 0.4; }
    b.latV = -b.latV * 0.3; b.lat = clamp(b.lat, -lim, lim);
    if (b.hp <= 0) { crashBot(b, 'wall'); return; }
  }
  if (b.fin < 0 && b.s >= R.laps * TRK.L) b.fin = R.time;
}

function botContacts(dt) {
  for (let i = 0; i < bots.length; i++) {
    const a = bots[i];
    if (a.out || a.crashT > 0 || a.ramT <= 0) continue;
    for (let j = 0; j < bots.length; j++) {
      if (i === j) continue;
      const o = bots[j];
      if (o.out || o.crashT > 0 || o.inv > 0) continue;
      if (Math.abs(wrapDS(a.s, o.s)) < 11 && Math.abs(a.lat - o.lat) < 13) {
        if (o.shield > 0) { o.shield = 0; a.v *= 0.7; } else { crashBot(o, 'rammed'); a.v *= 0.9; }
      }
    }
  }
}

function playerBotContacts() {
  if (R.phase !== 'race' || P.crashT > 0) return;
  const hr = VEH[P.veh].hitR * (P.knife ? 0.65 : 1);
  for (const b of bots) {
    if (b.out || b.crashT > 0) continue;
    const q = botPos(b), ddx = P.x - q.x, ddy = P.y - q.y, d = Math.hypot(ddx, ddy), rr = hr + b.hitR;
    if (d >= rr || d < 0.01) continue;
    const nx = ddx / d, ny = ddy / d;
    const side = Math.sign(ddx * -Math.sin(q.a) + ddy * Math.cos(q.a)) || 1;     // +1: player on the bot's right
    const rel = Math.abs(P.speed - b.v);
    if (P.ramOn && P.speed > 180) { takedownBot(b); continue; }
    if (b.ramT > 0 && b.inv <= 0) {
      if (damagePlayer(48, 'RAMMED')) { P.vx += -Math.sin(P.a) * side * 160; P.vy += Math.cos(P.a) * side * 160; }
      b.v *= 0.92; continue;
    }
    P.x += nx * (rr - d) * 0.4; P.y += ny * (rr - d) * 0.4;
    b.lat = clamp(b.lat - side * (rr - d) * 0.6, -TRK.half + 8, TRK.half - 8);
    if (b.hitT <= 0) {
      b.latV = -side * (70 + rel * 0.25) * P.st.shove; b.hitT = 0.35; b.hp -= 2 * P.st.shove;
      const absorb = VEH[P.veh].absorb;
      damagePlayer((2 + rel * 0.03) * (1 - absorb), 'CONTACT');
      addSparks((P.x + q.x) / 2, (P.y + q.y) / 2, 3); beep(130, 0.06, 'square', 0.06);
      if (VEH[P.veh].momentum) P.mom *= 0.7;
      const f = P.vx * Math.cos(P.a) + P.vy * Math.sin(P.a);
      if (f > b.v + 20 && Math.abs(ddx * -Math.sin(q.a) + ddy * Math.cos(q.a)) < 8) { P.vx *= 0.95; P.vy *= 0.95; }
    }
  }
  /* mines hit the player */
  for (let m = mines.length - 1; m >= 0; m--) {
    const mi = mines[m];
    if (mi.t < 0.8 && mi.own === 'p') continue;
    if (Math.hypot(mi.x - P.x, mi.y - P.y) < hr + 4) {
      addBoom(mi.x, mi.y, false); mines.splice(m, 1);
      if (P.shield <= 0 && P.inv <= 0) { P.ion = 2.5; damagePlayer(20, 'MINE'); P.vx *= 0.6; P.vy *= 0.6; setBanner('ION MINE', 1.0, '#60d0ff'); }
    }
  }
}

/* ---------------------------------------------------------------------
   STANDINGS + RACE FLOW
   --------------------------------------------------------------------- */
function standings() {
  const arr = bots.filter(b => !b.out).map(b => ({ b, t: b.s }));
  if (R.phase !== 'wrecked' && R.phase !== 'eliminated') arr.push({ b: null, t: P.total });
  return arr.sort((x, y) => y.t - x.t);
}
const playerRank = () => { const s = standings(); const i = s.findIndex(e => e.b === null); return i < 0 ? s.length + 1 : i + 1; };

function finishRace(kind) {
  const lapBest = R.lapTimes.length ? Math.min(...R.lapTimes) : 0;
  R.result = { kind, rank: R.rank, time: R.time, takedowns: R.takedowns, lapBest, crashes: P.st.crashes - P.crashesLeft, alive: R.alive, medal: R.tfMedal };
}

function updateRace(dt, inp) {
  animT += dt;
  if (banner.t > 0) banner.t -= dt;
  for (const b of booms) b.t += dt;
  booms = booms.filter(b => b.t < 1.4);
  for (const s of sparks) { s.t -= dt; s.x += s.vx * dt; s.y += s.vy * dt; }
  sparks = sparks.filter(s => s.t > 0);
  for (const m of mines) m.t += dt;
  const ph = R.phase;

  if (ph === 'countdown') {
    R.cdT -= dt;
    if (inp.up) R.rev = Math.min(1.1, R.rev + dt * 0.6); else R.rev = Math.max(0, R.rev - dt * 1.0);
    // quick-time engine start prompts
    for (const code of ['KeyZ', 'KeyX', 'KeyC']) if (pressed(code) && !R.qteDone && R.cdT > 0.3) {
      if (STYLES[P.style].ability === 'autopilot' && code === 'KeyC' && R.qteI === 0) { R.qteDone = true; R.qteI = 3; setBanner('AUTOPILOT STARTED ENGINES', 1.2, '#60d0ff'); break; }
      if (code === R.qte[R.qteI]) { R.qteI++; beep(500 + R.qteI * 120, 0.08); if (R.qteI >= R.qte.length) R.qteDone = true; } else R.qteI = 0;
    }
    if (R.cdT <= 0) {
      R.phase = 'race'; setBanner('GO!', 1.0, '#ffffff'); beep(880, 0.5, 'square', 0.09);
      const heading = P.a;
      if (R.qteDone) { P.ab = 100; P.abilCD = 0; }
      if (R.rev >= 0.40 && R.rev <= 0.70) {
        P.vx = Math.cos(heading) * 240; P.vy = Math.sin(heading) * 240; P.burstT = 1.0; P.burstMul = 1;
        setBanner(R.qteDone ? 'PERFECT LAUNCH!' : 'GOOD REV!', 1.4, '#ffd040');
      } else if (R.rev > 0.85) { R.launchDelay = 0.8; setBanner('WHEELSPIN!', 1.0, '#ff6060'); }
    }
  } else if (ph === 'race' || ph === 'finished' || ph === 'wrecked' || ph === 'eliminated') {
    const live = ph === 'race';
    if (live) R.time += dt;
    /* player */
    if (P.crashT > 0) {
      P.crashT -= dt;
      if (P.crashT <= 0) {
        if (P.crashesLeft < 0 && live) { R.phase = 'wrecked'; R.rank = R.alive; finishRace('wrecked'); P.hp = 0; }
        else if (live) respawnPlayer();
      }
    } else if (live) {
      if (pressed(...K.abil)) useAbility();
      updatePlayer(dt, inp);
    } else {
      P.ion = 0; updatePlayer(dt, { up: false, dn: true, steer: 0, ab: false, ram: false, drift: false });
    }
    if (P.crashT <= 0) R.wrongT = trackProgress() ? R.wrongT + dt : 0;

    /* bots */
    const ref = R.cfg.mode === 'test' ? null : P.total;
    for (const b of bots) updateBot(b, dt, ref);
    botContacts(dt);
    if (live) playerBotContacts();

    /* laps */
    const L = TRK.L;
    if (live) {
      const lap = Math.min(R.laps, Math.floor(Math.max(0, P.total) / L) + 1);
      if (lap !== P.lastLap && P.total > 0) {
        R.lapTimes.push(R.time - R.lapStart); R.lapStart = R.time; P.lastLap = lap;
        if (R.cfg.mode !== 'elim') setBanner(lap === R.laps ? 'FINAL LAP' : 'LAP ' + lap, 1.4); beep(660, 0.2);
      }
      R.rank = playerRank();
      /* modes */
      if (R.cfg.mode === 'circuit' || R.cfg.mode === 'test') {
        if (P.total >= R.laps * L) {
          R.lapTimes.push(R.time - R.lapStart);
          R.rank = 1 + bots.filter(b => !b.out && b.fin >= 0).length;
          if (R.cfg.mode === 'test') {
            const par = (L / (MAXV * 1.1)) * R.laps;       // gold = a clean run with good boost use
            R.tfMedal = R.time <= par ? 3 : R.time <= par * 1.12 ? 2 : R.time <= par * 1.28 ? 1 : 0;
            R.tfPar = par;
          }
          R.phase = 'finished'; finishRace('finish'); beep(523, 0.15); setTimeout(() => beep(659, 0.15), 160); setTimeout(() => beep(784, 0.4), 320);
        }
      } else if (R.cfg.mode === 'elim') {
        R.elimT = R.elimNext - R.time;
        if (R.elimT <= 0) {
          const s = standings();
          const last = s[s.length - 1];
          if (last.b === null) {
            R.phase = 'eliminated'; R.rank = R.alive; addBoom(P.x, P.y, true); boomSfx(); finishRace('eliminated');
            setBanner('ELIMINATED', 2.0, '#ff4040');
          } else {
            last.b.out = true; last.b.outWhy = 'ELIMINATED'; last.b.elimPlace = R.alive; R.alive--;
            const q = botPos(last.b); addBoom(q.x, q.y, true); setBanner(last.b.name + ' OUT', 1.2, '#ff9a40'); beep(200, 0.4, 'sawtooth', 0.09, 80);
          }
          R.elimNext += 14;
          if (R.phase === 'race' && R.alive <= 3) { R.rank = playerRank(); R.phase = 'finished'; finishRace('finish'); }
        }
      }
    }
  }

  /* camera */
  camA += angdiff(P.a, camA) * Math.min(1, 5 * dt);
  const cave = TRK.cave[P.idx] ? 1 : 0;
  R.cave += (cave - R.cave) * Math.min(1, 3 * dt);
  const sf = clamp((P.speed - MAXV * 0.95) / (MAXV * 0.75), 0, 1);
  camBack += (CAM_BACK + 45 * sf - camBack) * Math.min(1, 3 * dt);
  cam.a = camA; cam.x = P.x - Math.cos(camA) * camBack; cam.y = P.y - Math.sin(camA) * camBack;
  if (engGain) {
    const run = R.phase === 'race' || R.phase === 'finished';
    engGain.gain.value = muted || !run || P.crashT > 0 ? 0 : 0.035;
    eng.frequency.value = 55 + (P.speed / MAXV) * 140 + (P.ramOn ? 60 : 0);
  }
}
/* ---------------------------------------------------------------------
   RENDERING: Mode 7 ground, sorted sprites, HUD
   --------------------------------------------------------------------- */
const groundImg = ctx.createImageData(W, H - HORIZON);
const gbuf = new Uint32Array(groundImg.data.buffer);

function drawGround() {
  const tex = TRK.tex, fogC = TRK.planet.fogRGB, cave = R.cave;
  const cdx = Math.cos(cam.a), cdy = Math.sin(cam.a), crx = -cdy, cry = cdx;
  const fr = fogC[0] + (16 - fogC[0]) * cave, fg = fogC[1] + (12 - fogC[1]) * cave, fb = fogC[2] + (10 - fogC[2]) * cave;
  const dk = cave > 0.02 ? ((1 - 0.55 * cave) * 256) | 0 : 256;
  const gA = hexInt(TRK.planet.ground[0]), gB = hexInt(TRK.planet.ground[1]);
  for (let row = 0; row < H - HORIZON; row++) {
    const z = camH * FOCAL / (row + 0.5), sc = z / FOCAL;
    let wx = cam.x + cdx * z - crx * (W / 2) * sc, wy = cam.y + cdy * z - cry * (W / 2) * sc;
    const sx = crx * sc, sy = cry * sc;
    let fog = (z - FOG_START) / FOG_RANGE; fog = fog < 0 ? 0 : fog > 1 ? 1 : fog;
    const fi = (fog * 256) | 0;
    let o = row * W;
    for (let x = 0; x < W; x++, wx += sx, wy += sy) {
      let c;
      if (wx >= 0 && wy >= 0 && wx < T && wy < T) c = tex[(wy | 0) * T + (wx | 0)];
      else c = (((Math.floor(wx) >> 5) + (Math.floor(wy) >> 5)) & 1) ? gB : gA;
      let r = c & 255, g = (c >> 8) & 255, b = (c >> 16) & 255;
      if (dk !== 256) { r = (r * dk) >> 8; g = (g * dk) >> 8; b = (b * dk) >> 8; }
      if (fi > 0) { r += ((fr - r) * fi) >> 8; g += ((fg - g) * fi) >> 8; b += ((fb - b) * fi) >> 8; }
      gbuf[o++] = 0xff000000 | (b << 16) | (g << 8) | r;
    }
  }
  ctx.putImageData(groundImg, 0, HORIZON);
  // speed streaks while boosting
  if (R.phase === 'race' && (P.ramOn || P.abOn || P.burstT > 0 || P.speed > MAXV * 1.3)) {
    ctx.fillStyle = P.ramOn ? 'rgba(255,170,60,.55)' : 'rgba(150,220,255,.5)';
    for (let i = 0; i < 16; i++) {
      const x = (i * 71 + 13) % W, y = HORIZON + ((animT * 460 + i * 53) % (H - HORIZON));
      ctx.fillRect(x, y, 1, 8);
    }
  }
}

function drawSpriteScaled(spr, sx, gy, w, ratio, lean) {
  w = Math.max(2, Math.round(w));
  const h = Math.max(1, Math.round(w * ratio));
  if (!lean) { ctx.drawImage(spr, Math.round(sx - w / 2), Math.round(gy - h), w, h); return; }
  const rows = spr.height, dh = h / rows;
  for (let r = 0; r < rows; r++) {
    const ox = lean * (r - rows * 0.66) * w / 40;
    ctx.drawImage(spr, 0, r, spr.width, 1, Math.round(sx - w / 2 + ox), Math.round(gy - h + r * dh), w, Math.ceil(dh) + 0.5);
  }
}
function drawBoom(sx, gy, t, sc, big) {
  if (t >= 1.4) return;
  const n = big ? 16 : 9;
  for (let i = 0; i < n; i++) {
    const a = i * 2.4 + t * 2, rr = Math.min(t, 1.2) * (14 + (i % 4) * 8) * sc * (big ? 1 : 0.55);
    ctx.fillStyle = ['#fff2a0', '#ffb030', '#ff5a10', '#601818'][(i + (t * 12 | 0)) % 4];
    const s = Math.max(1, (9 - t * 6 + (i % 3) * 2) * sc * (big ? 1 : 0.6));
    ctx.fillRect(sx + Math.cos(a) * rr - s / 2, gy - 8 * sc + Math.sin(a) * rr * 0.6 - s / 2, s, s);
  }
}
function drawSmoke(sx, gy, w) {
  for (let i = 0; i < 3; i++) {
    const t = (animT * 1.6 + i / 3) % 1;
    ctx.fillStyle = 'rgba(70,70,80,' + (0.7 * (1 - t)).toFixed(2) + ')';
    const s = Math.max(1, Math.round(w / 8 * (1 + t)));
    ctx.fillRect(Math.round(sx - w * 0.2 + (i - 1) * w * 0.2 + Math.sin(animT * 9 + i) * 1.5), Math.round(gy - w / 2 - t * w * 0.5), s, s);
  }
}
function drawShieldRing(sx, gy, w) {
  ctx.strokeStyle = 'rgba(96,208,255,' + (0.55 + 0.25 * Math.sin(animT * 20)).toFixed(2) + ')';
  ctx.lineWidth = 1;
  ctx.strokeRect(Math.round(sx - w * 0.6) + 0.5, Math.round(gy - w * 0.7) + 0.5, Math.round(w * 1.2), Math.round(w * 0.7));
}
function drawFlames(sx, gy, w, col1, col2, frame, big) {
  ctx.fillStyle = frame ? col1 : col2;
  const fw = Math.max(2, Math.round(w / 10)), fh = Math.round(w / (big ? 3 : 5) + frame * 2);
  ctx.fillRect(Math.round(sx - w * 0.31), Math.round(gy - w / 6), fw, fh);
  ctx.fillRect(Math.round(sx + w * 0.31 - fw), Math.round(gy - w / 6), fw, fh);
}

const MINE_A = propSprite('mine', PAL_MINE), MINE_B = propSprite('mine', { ...PAL_MINE, r: '#601010' });

function drawWorldObjects(showPlayer) {
  const cdx = Math.cos(cam.a), cdy = Math.sin(cam.a), crx = -cdy, cry = cdx;
  const items = [];
  const add = (x, y, kind, ref, maxFwd) => {
    const dx = x - cam.x, dy = y - cam.y, fwd = dx * cdx + dy * cdy;
    if (fwd < 6 || fwd > (maxFwd || 6000)) return;
    const lat = dx * crx + dy * cry;
    if (Math.abs(lat * FOCAL / fwd) > W) return;
    items.push({ fwd, lat, kind, ref });
  };
  for (const o of TRK.decor) add(o.x, o.y, 'prop', o, 5200);
  for (const o of TRK.obst) add(o.x, o.y, 'prop', o, 4200);
  for (const m of mines) add(m.x, m.y, 'mine', m, 1800);
  for (const b of bots) if (!b.out) { const q = botPos(b); add(q.x, q.y, 'bot', b, 6000); }
  for (const b of booms) add(b.x, b.y, 'boom', b, 3000);
  if (showPlayer && P.crashT <= 0 && R.phase !== 'wrecked' && R.phase !== 'eliminated') add(P.x, P.y, 'player', P, 6000);
  items.sort((a, b) => b.fwd - a.fwd);
  const frame = (animT * 14 | 0) & 1;
  for (const it of items) {
    const k = FOCAL / it.fwd, sx = W / 2 + it.lat * k, gy = HORIZON + camH * k;
    const o = it.ref;
    if (it.kind === 'boom') { drawBoom(sx, gy, o.t, clamp(k / 2, 0.1, 2), o.big); continue; }
    if (it.kind === 'prop') {
      const spr = propSprite(o.shape, o.pal), w = o.w * k;
      drawSpriteScaled(spr, sx, gy, w, 14 / 24 * o.ah, 0);
      continue;
    }
    if (it.kind === 'mine') { drawSpriteScaled(((animT * 4 | 0) & 1) ? MINE_A : MINE_B, sx, gy, 10 * k, 14 / 24, 0); continue; }
    if (it.kind === 'bot') {
      const v = VEH[o.cls], w = VEH_SCALE * v.wmul * k;
      if (o.crashT > 0) { drawBoom(sx, gy, 1.5 - Math.min(1.4, o.crashT * 0.5), clamp(k / 2, 0.1, 2), true); continue; }
      ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(Math.round(sx - w * 0.45), Math.round(gy - 1), Math.round(w * 0.9), Math.max(1, Math.round(w / 10)));
      if (!(o.inv > 0 && ((animT * 24 | 0) & 1))) drawSpriteScaled(o.spr[frame], sx, gy, w, 0.5, 0);
      if (o.ramT > 0) drawFlames(sx, gy, w, '#ffe880', '#ff7a30', frame, true);
      else if (o.abT > 0) drawFlames(sx, gy, w, '#c8f0ff', '#60b8ff', frame, false);
      if (o.shield > 0) drawShieldRing(sx, gy, w);
      if (o.ion > 0) { ctx.fillStyle = '#60d0ff'; ctx.fillRect(Math.round(sx + Math.sin(animT * 30) * w * 0.3), Math.round(gy - w * 0.4), 1, 2); }
      if (o.hp < 40 || o.heat > 80) drawSmoke(sx, gy, w);
      if (it.fwd < 260 && it.fwd > 20) { const nm = o.name, tw = txtW(nm, 1); txt(nm, Math.round(sx - tw / 2), Math.round(gy - w * 0.5 - 8), 1, '#ffffff'); }
      continue;
    }
    if (it.kind === 'player') {
      const v = VEH[P.veh], w = VEH_SCALE * v.wmul * k, spr = vehicleSprites(P.veh, v.cb[0], v.cb[1], v.cb[2]);
      ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(Math.round(sx - w * 0.45), Math.round(gy - 1), Math.round(w * 0.9), Math.max(1, Math.round(w / 10)));
      const bob = P.speed > 50 ? ((animT * 30 | 0) & 1) : 0;
      const blink = (P.inv > 0 || P.hurtT > 0) && ((animT * 24 | 0) & 1);
      if (!blink) drawSpriteScaled(spr[frame], sx, gy - bob, w, 0.5, P.steer);
      if (P.ramOn) drawFlames(sx, gy - bob, w, '#ffe880', '#ff6a20', frame, true);
      else if (P.abOn || P.burstT > 0) drawFlames(sx, gy - bob, w, '#c8f0ff', '#60b8ff', frame, false);
      if (P.shield > 0) drawShieldRing(sx, gy - bob, w);
      if (P.ion > 0 && ((animT * 20 | 0) & 1)) { ctx.fillStyle = '#60d0ff'; for (let i = 0; i < 3; i++) ctx.fillRect(Math.round(sx - w * 0.4 + ((animT * 97 + i * 31) % (w * 0.8))), Math.round(gy - w * 0.4 - i * 2), 1, 2); }
      if (P.heat > 80 && ((animT * 10 | 0) & 1)) drawSmoke(sx, gy, w);
      if (P.hp < 30) drawSmoke(sx, gy, w);
      if (P.drifting) { ctx.fillStyle = P.charge > 0.35 ? '#ffd040' : '#ffffff'; for (let i = 0; i < 3; i++) ctx.fillRect(Math.round(sx - w * 0.5 + i * w * 0.5), Math.round(gy - 1), 1, 2); }
    }
  }
  for (const s of sparks) {                                // sparks in world space
    const dx = s.x - cam.x, dy = s.y - cam.y, fwd = dx * cdx + dy * cdy;
    if (fwd < 8) continue;
    const k = FOCAL / fwd;
    ctx.fillStyle = '#ffe060'; ctx.fillRect(Math.round(W / 2 + (dx * crx + dy * cry) * k), Math.round(HORIZON + camH * k - 3), 1, 1);
  }
}

function renderWorld(showPlayer) {
  drawSky(TRK.planet, camA * 81.5, animT, R.cave);
  drawGround();
  drawWorldObjects(showPlayer);
}

/* ---------------------------------------------------------------------
   HUD
   --------------------------------------------------------------------- */
function bar(x, y, w, h, frac, col, back = '#2a3050') {
  ctx.fillStyle = '#000'; ctx.fillRect(x - 1, y - 1, w + 2, h + 2);

function updateAttract(dt) {
  animT += dt; attractT += dt; R.time += dt;
  if (banner.t > 0) banner.t -= dt;
  for (const b of booms) b.t += dt;
  booms = booms.filter(b => b.t < 1.4);
  for (const b of bots) updateBot(b, dt, null);
  botContacts(dt);
  let f = bots[attractFocus];
  if (!f || f.out || f.crashT > 0) { attractFocus = bots.findIndex(b => !b.out && b.crashT <= 0); f = bots[attractFocus]; }
  if (!f || attractT > 40) { startAttract(); return; }

const MYSTERIES = [

/* ---------------------------------------------------------------------
   RACE SCREEN
   --------------------------------------------------------------------- */
function raceInput() {
  return { up: down(...K.up), dn: down(...K.dn), steer: (down(...K.rt) ? 1 : 0) - (down(...K.lf) ? 1 : 0),
    ab: down(...K.ab), ram: down(...K.ram), drift: down(...K.drift) };
}
function updateRaceScreen(dt) {
  const ph = R.phase;
  if (paused) {
    const rows = tour ? ['RESUME', 'ABANDON TOUR'] : ['RESUME', 'RESTART', 'QUIT'];
    if (pressed(...K.up)) pauseSel = cycle(pauseSel, -1, rows.length);
    if (pressed(...K.dn)) pauseSel = cycle(pauseSel, 1, rows.length);
    if (pressed(...K.pause, ...K.back)) paused = false;
    if (pressed(...K.ok)) {
      const r = rows[pauseSel];
      if (r === 'RESUME') paused = false;
      else if (r === 'RESTART') launchRace(lastRaceCfg, raceReturn);
      else if (r === 'QUIT') { paused = false; startAttract(); go(raceReturn === 'test' ? 'test' : 'quick'); }
      else if (r === 'ABANDON TOUR') { paused = false; startAttract(); endTour(false); }
    }
    return;
  }
  if (pressed(...K.pause, ...K.back) && (ph === 'race' || ph === 'countdown')) { paused = true; pauseSel = 0; return; }
  const slow = R.slowT > 0; if (slow) R.slowT -= dt;
  updateRace(dt * (slow ? 0.35 : 1), raceInput());
  if (ph === 'finished' || ph === 'wrecked' || ph === 'eliminated') {
    R.endT += dt;
    if (R.endT > 1.4 && pressed(...K.ok)) go('results');
  }
}
function drawRaceScreen() {
  renderWorld(true);
  const ph = R.phase;
  if (ph === 'countdown') drawCountdownHUD();
  drawHUD();
  if (R.slowT > 0) { ctx.fillStyle = 'rgba(255,120,40,.10)'; ctx.fillRect(0, 0, W, H); }
  if (ph === 'finished' || ph === 'wrecked' || ph === 'eliminated') {
    if (R.endT > 0.6) {
      const res = R.result;
      panel(40, 56, 176, 56, 0.8);
      txtC(ph === 'finished' ? (R.cfg.mode === 'test' ? 'COURSE COMPLETE' : res.rank === 1 ? 'VICTORY!' : 'FINISH!') : ph === 'wrecked' ? 'WRECKED' : 'ELIMINATED', 62, 2, ph === 'finished' ? '#ffe040' : '#ff5050');
      if (R.endT > 1.4 && ((uiT * 2 | 0) & 1)) txtC('PRESS ENTER', 92, 1, '#ffffff');
    }
  }
  if (P.crashT > 0 && R.phase === 'race') {
    ctx.fillStyle = 'rgba(255,60,20,' + (0.18 * Math.min(1, P.crashT)).toFixed(2) + ')'; ctx.fillRect(0, 0, W, H);
    txtC(P.crashesLeft >= 0 ? 'CRASHES LEFT ' + P.crashesLeft : 'NO CRASHES LEFT', 98, 1, '#ffffff');
  }
  if (paused) {
    panel(76, 70, 104, 14 * (tour ? 2 : 3) + 28, 0.9);
    txtC('PAUSED', 76, 2, '#ffe040');
    (tour ? ['RESUME', 'ABANDON TOUR'] : ['RESUME', 'RESTART', 'QUIT']).forEach((r, i) => txt((i === pauseSel ? '> ' : '  ') + r, 84, 96 + i * 12, 1, i === pauseSel ? '#ffffff' : '#c8d0ff'));
  }
}
/* ---------------------------------------------------------------------
   MAIN LOOP
   --------------------------------------------------------------------- */
function updateBackground(dt) {
  if (R.phase === 'attract') updateAttract(dt);
  else updateRace(dt, { up: false, dn: true, steer: 0, ab: false, ram: false, drift: false });   // finished race stays alive behind results
}
function update(dt) {
  uiT += dt;
  if (flash.t > 0) flash.t -= dt;
  if (scene === 'race') updateRaceScreen(dt);
  else { updateBackground(dt); const s = SCREENS[scene]; if (s.update) s.update(); }
}
function render() {
  if (scene === 'race') { drawRaceScreen(); }
  else {
    renderWorld(R.phase !== 'attract');
    ctx.fillStyle = 'rgba(0,0,24,.28)'; ctx.fillRect(0, 0, W, H);
    SCREENS[scene].draw();
  }
  if (flash.t > 0) { panel(W / 2 - txtW(flash.text, 1) / 2 - 8, 192, txtW(flash.text, 1) + 16, 14, 0.85); txtC(flash.text, 196, 1, '#ffe040'); }
}
let lastT = performance.now();
function frame(now) {
  const dt = clamp((now - lastT) / 1000, 0, 0.05);
  lastT = now;
  update(dt);
  render();
  pressedKeys.clear();
  requestAnimationFrame(frame);
}
go('title');
requestAnimationFrame(frame);
</script>
